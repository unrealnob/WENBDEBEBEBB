<!doctype html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link href="/styles.css" rel="stylesheet">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;500;700&display=swap" rel="stylesheet">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react/19.3.1/cjs/react.production.min.js" integrity="sha512-7sosxMqYZyW6f2wcLhDBteocBukDPHggWfJjbdIIvBzJz/W5AQ0qlcycx5njnXvhyy42va9YB2LG5Y9d7OhHqQ==" crossorigin="anonymous" referrerpolicy="no-referrer"></script>
</head>

<body class="bg-cover bg-center h-screen text-white">
  <header class="bg-[#FF7F50]">
    <nav class="font-navbar font-bold flex items-center justify-between px-12 h-20 lg:gap-8">
      <a href="#" class="text-2xl font-bold font-navbar whitespace-nowrap">Chronolog</a>
      <div class="dropdown-menu absolute -top-full left-0 max-lg:bg-[#E25822] w-full flex flex-col gap-6 items-center py-2 text-lg font-bold lg:static lg:flex-row lg:justify-between">
        <ul class="flex flex-col gap-4 items-center lg:flex-row lg:gap-8">
          <li class="hover:text-[#FFA000]">Credits</li>
          <li class="hover:text-[#FFA000]">Scanner</li>
          <li class="hover:text-[#FFA000]">Attendance</li>
        </ul>
      </div>

      <div class="toggle-button lg:hidden">
        <span class="icon-[ic--baseline-menu] w-10 h-10"></span>
      </div>
      
      
    </nav>

    
  </header>

  <script>
      const toggleBtn = document.querySelector(".toggle-button");
      const dropdown = document.querySelector(".dropdown-menu");

      toggleBtn.addEventListener("click", () => {
        dropdown.classList.toggle('top-16');
      })
    </script>

</body>
</html>
